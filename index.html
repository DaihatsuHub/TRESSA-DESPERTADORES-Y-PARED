<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Descubrí la colección de despertadores TRESSA y sus variantes de color."><title>Tressa - Despertadores y Pared</title><meta property="og:title" content="Tressa - Despertadores y Pared"><meta property="og:description" content="Catálogo Tressa. Descubrí los modelos y sus colores."><meta property="og:image" content="https://daihatsuhub.github.io/TRESSA-DESPERTADORES-Y-PARED/assets/T-DD400-ambiente.jpg"><meta property="og:type" content="website"><style>
:root{--wine:#732b38;--ink:#262528;--muted:#777477}*{box-sizing:border-box}body{margin:0;background:#faf9f7;color:var(--ink);font-family:Arial,Helvetica,sans-serif}header{background:white;border-bottom:1px solid #eae6e3;padding:24px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-size:29px;letter-spacing:5px;font-weight:700;color:var(--wine)}header span{font-size:12px;letter-spacing:2px;color:var(--muted)}main{max-width:1400px;margin:auto;padding:48px 5%}.eyebrow{font-size:11px;color:var(--wine);font-weight:bold;letter-spacing:2px}h1{font-size:clamp(30px,4vw,48px);font-weight:500;letter-spacing:-1px;margin:14px 0}p{color:var(--muted);line-height:1.6}.tools{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:32px 0 24px;border-top:1px solid #e1dcda;padding-top:24px}.tools input{font:inherit;min-width:260px;border:1px solid #dcd6d3;border-radius:6px;padding:13px;background:white}.tools span{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.card{background:white;border:1px solid #e9e4e0;border-radius:10px;overflow:hidden}.picture{position:relative;background:white;display:block;width:100%;height:290px;border:0;cursor:zoom-in;padding:22px}.picture img{width:100%;height:100%;object-fit:contain;transition:transform .25s}.picture:hover img{transform:scale(1.05)}.zoom{position:absolute;right:16px;bottom:12px;color:#888;font-size:11px}.details{padding:22px 24px 25px;border-top:1px solid #f2efed}.type{text-transform:uppercase;font-size:10px;letter-spacing:1.5px;color:#888}.details h2{font-size:24px;margin:9px 0 20px;font-weight:500}.colorlabel{font-size:13px;margin-bottom:12px}.variants{display:flex;gap:7px;flex-wrap:wrap}.variant{width:48px;height:48px;background:#fff;border:1px solid #ded9d6;border-radius:6px;padding:3px;cursor:pointer}.variant img{height:100%;width:100%;object-fit:contain}.variant[aria-pressed=true]{border:2px solid var(--wine);padding:2px}.supplier{font-size:11px;color:#999;margin-top:18px}footer{border-top:1px solid #e1dcda;padding:25px 0;margin-top:44px;font-size:12px;color:#888;display:flex;justify-content:space-between}dialog{border:0;padding:24px;border-radius:12px;max-width:94vw;width:850px}dialog::backdrop{background:#171518bc}dialog img{width:100%;height:65vh;object-fit:contain}.close{float:right;border:0;border-radius:50%;width:36px;height:36px;background:#eee;font-size:23px;cursor:pointer}#caption{text-align:center;margin:12px}button:focus-visible{outline:3px solid #bba1a8;outline-offset:3px}.empty{grid-column:1/-1;padding:60px;text-align:center}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){header{padding:20px}.brand{font-size:24px}header span{font-size:9px;letter-spacing:1px}main{padding:30px 18px}.tools{align-items:stretch;flex-direction:column;gap:12px}.tools input{width:100%;min-width:0}.grid{grid-template-columns:1fr;gap:20px}.picture{height:310px}.details{padding:20px}footer{gap:12px;flex-direction:column}dialog{padding:15px}dialog img{height:55vh}}
.brand-logo{width:210px;height:auto;display:block}.variant{width:62px;height:78px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:4px}.variant img{height:48px;width:50px}.variant span{font-size:10px;color:#555}.variant[aria-pressed=true]{padding:3px}.picture.ambient{padding:0;height:290px}.picture.ambient img{object-fit:cover}.picture.ambient .zoom{background:#ffffffdd;padding:5px;border-radius:4px}.ambient-toggle{font:inherit;font-size:12px;border:1px solid #dcd6d3;background:white;border-radius:4px;padding:9px 12px;margin:0 0 16px;cursor:pointer}.ambient-note{font-size:10px;color:#888;margin-top:12px}@media(max-width:600px){.brand-logo{width:170px}.picture.ambient{height:270px}main{padding-top:24px}}</style></head><body><header><img class="brand-logo" src="assets/tressa-logo.png" alt="TRESSA"><span>CATÁLOGO DE RELOJES</span></header><main><div class="eyebrow">COLECCIÓN · DESPERTADORES</div><div class="tools"><input id="search" type="search" placeholder="Buscar modelo o código…" aria-label="Buscar modelo"><span id="count" aria-live="polite">Cargando modelos…</span></div><section class="grid" id="grid" aria-label="Modelos de despertadores"></section><footer><span>TRESSA · Despertadores y relojes de pared</span><span>Muestra de catálogo · 5 modelos</span></footer></main><dialog id="viewer"><button class="close" aria-label="Cerrar imagen">×</button><img id="large" alt=""><div id="caption"></div></dialog><script>
let products=[];const grid=document.querySelector('#grid'),viewer=document.querySelector('#viewer');
function show(p,c){document.querySelector('#large').src=c.src;document.querySelector('#large').alt=p.code+' · '+c.name;document.querySelector('#caption').textContent=p.code+' · '+c.name;viewer.showModal()}
function render(){const term=document.querySelector('#search').value.trim().toLowerCase();const list=products.filter(p=>(p.code+' '+p.supplier).toLowerCase().includes(term));document.querySelector('#count').textContent=list.length+' modelos · '+list.reduce((n,p)=>n+p.colors.length,0)+' variantes de color';grid.replaceChildren();for(const p of list){let active={name:'En ambiente',src:p.ambient};const card=document.createElement('article');card.className='card';card.innerHTML=`<button class="picture ambient" aria-label="Ampliar ${p.code}"><img src="${active.src}" alt="${p.code} · ${active.name}"><span class="zoom">Ampliar ↗</span></button><div class="details"><div class="type">Despertador analógico</div><h2>${p.code}</h2><button class="ambient-toggle">Ver en ambiente</button><div class="colorlabel">Vista: <strong>${active.name}</strong></div><div class="variants" aria-label="Colores de ${p.code}"></div><div class="ambient-note">Ambientación ilustrativa. Consultá las fotos de cada color.</div><div class="supplier">Ref. proveedor: ${p.supplier}</div></div>`;card.querySelector('.picture').onclick=()=>show(p,active);card.querySelector('.ambient-toggle').onclick=()=>{active={name:'En ambiente',src:p.ambient};card.querySelector('.picture').classList.add('ambient');card.querySelector('.picture img').src=active.src;card.querySelector('.picture img').alt=p.code+' en ambiente';card.querySelector('.colorlabel strong').textContent='En ambiente';card.querySelectorAll('.variant').forEach(x=>x.setAttribute('aria-pressed','false'))};for(const c of p.colors){const b=document.createElement('button');b.className='variant';b.title=c.name;b.setAttribute('aria-label',c.name);b.setAttribute('aria-pressed',String(c===active));b.innerHTML=`<img src="${c.src}" alt="" loading="lazy"><span>${c.name}</span>`;b.onclick=()=>{active=c;card.querySelector('.picture').classList.remove('ambient');card.querySelector('.picture img').src=c.src;card.querySelector('.picture img').alt=p.code+' · '+c.name;card.querySelector('.colorlabel strong').textContent=c.name;card.querySelectorAll('.variant').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))};card.querySelector('.variants').append(b)}grid.append(card)}if(!list.length)grid.innerHTML='<p class="empty">No encontramos modelos con ese código.</p>'}
document.querySelector('#search').addEventListener('input',render);document.querySelector('.close').onclick=()=>viewer.close();viewer.addEventListener('click',e=>{if(e.target===viewer){const r=viewer.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)viewer.close()}});fetch('products.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(p=>{products=p;render()}).catch(()=>{document.querySelector('#count').textContent='No se pudo cargar el catálogo. Volvé a intentar.'});
</script></body></html>
