function modelDimensions(p){return p.supplier==='BB06602' ? '<div class="dimensions">Dimensiones: 62 × 30 × 59 mm</div>' : ''}

function colorText(c){return c.id ? c.id+' · '+c.name : c.name}
function show(p,c){document.querySelector('#large').src=c.src;document.querySelector('#large').alt=p.code+' · '+colorText(c);document.querySelector('#caption').textContent=p.code+' · '+colorText(c);viewer.showModal()}
function render(){const term=document.querySelector('#search').value.trim().toLowerCase();const list=products.filter(p=>(p.code+' '+p.supplier).toLowerCase().includes(term));document.querySelector('#count').textContent=list.length+' modelos · '+list.reduce((n,p)=>n+p.colors.length,0)+' variantes de color';grid.replaceChildren();for(const p of list){let active={name:'En ambiente',src:p.ambient};const card=document.createElement('article');card.className='card';card.innerHTML=`<button class="picture ambient" aria-label="Ampliar ${p.code}"><img src="${active.src}" alt="${p.code} · ${active.name}"><span class="zoom">Ampliar ↗</span></button><button class="ambient-toggle" title="Volver a la foto ambientada" aria-label="Volver a la foto ambientada" hidden>↶</button><div class="details"><div class="model-heading"><h2>${p.code}</h2>${modelSpecs(p)}</div>${modelDimensions(p)}<div class="variants" aria-label="Colores de ${p.code}"></div></div>`;card.querySelector('.picture').onclick=()=>show(p,active);card.querySelector('.ambient-toggle').onclick=()=>{active={name:'En ambiente',src:p.ambient};card.querySelector('.picture').classList.add('ambient');card.querySelector('.picture img').src=active.src;card.querySelector('.picture img').alt=p.code+' en ambiente';card.querySelector('.ambient-toggle').hidden=true;card.querySelectorAll('.variant').forEach(x=>x.setAttribute('aria-pressed','false'))};for(const c of p.colors){const b=document.createElement('button');b.className='variant';b.title=colorText(c);b.setAttribute('aria-label',colorText(c));b.setAttribute('aria-pressed',String(c===active));b.innerHTML=`<img src="${c.src}" alt="" loading="lazy"><span><b>${c.id}</b><br>${c.name}</span>`;b.onclick=()=>{active=c;card.querySelector('.picture').classList.remove('ambient');card.querySelector('.picture img').src=c.src;card.querySelector('.picture img').alt=p.code+' · '+colorText(c);card.querySelector('.ambient-toggle').hidden=false;card.querySelectorAll('.variant').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))};card.querySelector('.variants').append(b)}grid.append(card)}if(!list.length)grid.innerHTML='<p class="empty">No encontramos modelos con ese código.</p>'}
document.querySelector('#search').addEventListener('input',render);document.querySelector('.close').onclick=()=>viewer.close();viewer.addEventListener('click',e=>{if(e.target===viewer){const r=viewer.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)viewer.close()}});fetch('products.json?v=pared-7-modelos', {cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(p=>{products=p;render()}).catch(()=>{document.querySelector('#count').textContent='No se pudo cargar el catálogo. Volvé a intentar.'});
</script></body></html>
