<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Descubrí los despertadores y relojes de pared TRESSA y sus colores."><title>Tressa - Despertadores y Pared</title><meta property="og:title" content="Tressa - Despertadores y Pared"><meta property="og:description" content="Catálogo Tressa. Descubrí los modelos y sus colores."><meta property="og:image" content="https://daihatsuhub.github.io/TRESSA-DESPERTADORES-Y-PARED/assets/T-DD400-final.jpg"><meta property="og:type" content="website"><style>
:root{--wine:#732b38;--ink:#262528;--muted:#777477}*{box-sizing:border-box}body{margin:0;background:#faf9f7;color:var(--ink);font-family:Arial,Helvetica,sans-serif}header{background:white;border-bottom:1px solid #eae6e3;padding:24px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-size:29px;letter-spacing:5px;font-weight:700;color:var(--wine)}header span{font-size:12px;letter-spacing:2px;color:var(--muted)}main{max-width:1400px;margin:auto;padding:48px 5%}.eyebrow{font-size:11px;color:var(--wine);font-weight:bold;letter-spacing:2px}h1{font-size:clamp(30px,4vw,48px);font-weight:500;letter-spacing:-1px;margin:14px 0}p{color:var(--muted);line-height:1.6}.tools{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:32px 0 24px;border-top:1px solid #e1dcda;padding-top:24px}.tools input{font:inherit;min-width:260px;border:1px solid #dcd6d3;border-radius:6px;padding:13px;background:white}.tools span{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.card{background:white;border:1px solid #e9e4e0;border-radius:10px;overflow:hidden}.picture{position:relative;background:white;display:block;width:100%;height:290px;border:0;cursor:zoom-in;padding:22px}.picture img{width:100%;height:100%;object-fit:contain;transition:transform .25s}.picture:hover img{transform:scale(1.05)}.zoom{position:absolute;right:16px;bottom:12px;color:#888;font-size:11px}.details{padding:22px 24px 25px;border-top:1px solid #f2efed}.type{text-transform:uppercase;font-size:10px;letter-spacing:1.5px;color:#888}.details h2{font-size:24px;margin:9px 0 20px;font-weight:500}.colorlabel{font-size:13px;margin-bottom:12px}.variants{display:flex;gap:7px;flex-wrap:wrap}.variant{width:48px;height:48px;background:#fff;border:1px solid #ded9d6;border-radius:6px;padding:3px;cursor:pointer}.variant img{height:100%;width:100%;object-fit:contain}.variant[aria-pressed=true]{border:2px solid var(--wine);padding:2px}.supplier{font-size:11px;color:#999;margin-top:18px}footer{border-top:1px solid #e1dcda;padding:25px 0;margin-top:44px;font-size:12px;color:#888;display:flex;justify-content:space-between}dialog{border:0;padding:24px;border-radius:12px;max-width:94vw;width:850px}dialog::backdrop{background:#171518bc}dialog img{width:100%;height:65vh;object-fit:contain}.close{float:right;border:0;border-radius:50%;width:36px;height:36px;background:#eee;font-size:23px;cursor:pointer}#caption{text-align:center;margin:12px}button:focus-visible{outline:3px solid #bba1a8;outline-offset:3px}.empty{grid-column:1/-1;padding:60px;text-align:center}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){header{padding:20px}.brand{font-size:24px}header span{font-size:9px;letter-spacing:1px}main{padding:30px 18px}.tools{align-items:stretch;flex-direction:column;gap:12px}.tools input{width:100%;min-width:0}.grid{grid-template-columns:1fr;gap:20px}.picture{height:310px}.details{padding:20px}footer{gap:12px;flex-direction:column}dialog{padding:15px}dialog img{height:55vh}}
.brand-logo{width:210px;height:auto;display:block}.variant{width:66px;height:92px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:4px}.variant img{height:48px;width:50px}.variant span{font-size:10px;color:#555}.variant[aria-pressed=true]{padding:3px}.picture.ambient{padding:0;height:290px}.picture.ambient img{object-fit:cover}.picture.ambient .zoom{background:#ffffffdd;padding:5px;border-radius:4px}.ambient-toggle{font:inherit;font-size:12px;border:1px solid #dcd6d3;background:white;border-radius:4px;padding:9px 12px;margin:0 0 16px;cursor:pointer}.ambient-note{font-size:10px;color:#888;margin-top:12px}@media(max-width:600px){.brand-logo{width:170px}.picture.ambient{height:270px}main{padding-top:24px}}.specs{margin:-5px 0 20px;padding:16px 0;border-top:1px solid #eee8e4;border-bottom:1px solid #eee8e4}.specs svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.measure{display:flex;align-items:center;gap:11px}.measure svg{width:28px;height:28px;color:var(--wine)}.measure small{display:block;font-size:9px;letter-spacing:1.3px;color:#777;margin-bottom:5px}.measure strong{font-size:15px;font-weight:500}.features{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:19px}.feature{display:flex;align-items:center;flex-direction:column;gap:8px;text-align:center}.feature svg{width:25px;height:25px;color:var(--wine)}.feature span{font-size:10px;line-height:1.4;max-width:70px}.card{position:relative}.picture,.picture.ambient{height:230px}.details{padding:15px 16px 16px}.model-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;margin-bottom:4px}.details h2{font-size:22px;white-space:nowrap;margin:0;font-weight:600}.catalog-icons{width:144px;max-width:48%;height:auto;object-fit:contain}.dimensions{font-size:12px;color:#635d5b;margin:6px 0 12px;white-space:nowrap}.variants{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;border-top:1px solid #eee8e4;padding-top:12px;margin-top:9px}.variant{width:100%;height:79px;padding:3px;gap:3px;min-width:0}.variant img{width:100%;height:42px}.variant span{font-size:9px;line-height:1.25}.variant[aria-pressed=true]{padding:2px}.ambient-toggle{position:absolute;top:10px;left:10px;z-index:2;width:32px;height:32px;border:1px solid #ded8d4;background:#fffffff0;border-radius:50%;padding:0;margin:0;font-size:22px;line-height:30px;cursor:pointer}.ambient-toggle[hidden]{display:none}@media(max-width:600px){.picture,.picture.ambient{height:230px}.details{padding:13px 14px 14px}.model-heading{min-height:38px}.catalog-icons{width:144px}.variant{height:82px}.variant img{height:45px}}.tools{flex-wrap:wrap;gap:12px}.tools input{flex:1}.tools select{font:inherit;font-size:14px;background:#fff;border:1px solid #dcd6d3;border-radius:6px;padding:13px;max-width:100%}.tools span{margin-left:auto}.functions{border:0;background:white;padding:0;display:flex;align-items:center;justify-content:flex-end;cursor:pointer;flex-shrink:1;min-width:0}.functions .catalog-icons{width:var(--icon-width);max-width:100%;max-height:43px;object-fit:contain}.digital-functions{font-size:15px;font-weight:bold;color:#333;white-space:nowrap}.digital-functions span{font-size:11px;margin:0 6px}#functions-viewer{max-width:90vw;width:400px;padding:24px}#functions-viewer li{line-height:1.7;font-size:14px}#functions-viewer h2{font-size:24px}.picture img{display:block}main{padding-top:30px}.model-heading{gap:5px}.details h2{font-size:21px}@media(max-width:600px){.tools span{margin-left:0}.functions .catalog-icons{max-height:43px}.details h2{font-size:22px}}@media(min-width:601px) and (max-width:1150px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><header><img class="brand-logo" src="assets/tressa-logo.png" alt="TRESSA"><span>CATÁLOGO DE RELOJES</span></header><main><div class="eyebrow">DESPERTADORES Y RELOJES DE PARED</div><div class="tools"><input id="search" type="search" placeholder="Buscar modelo o código…" aria-label="Buscar modelo"><select id="category" aria-label="Tipo de reloj"><option value="">Todos los relojes</option><option>Despertador</option><option>Reloj de pared</option></select><span id="count" aria-live="polite">Cargando modelos…</span></div><section class="grid" id="grid" aria-label="Modelos de relojes"></section><footer><span>TRESSA · Despertadores y relojes de pared</span><span>27 modelos · 117 variantes de color</span></footer></main><dialog id="viewer"><button class="close" aria-label="Cerrar imagen">×</button><img id="large" alt=""><div id="caption"></div></dialog><dialog id="functions-viewer"><button class="close" onclick="this.closest('dialog').close()" aria-label="Cerrar funciones">×</button><h2></h2><p class="function-dimensions"></p><ul></ul></dialog><script>
let products=[];const grid=document.querySelector('#grid'),viewer=document.querySelector('#viewer');
function modelSpecs(p){const label=p.features.join(' · ');return `<button class="functions" type="button" aria-label="Funciones de ${p.code}: ${label}" title="${label}" style="--icon-width:${p.features.length*36}px">${p.icons?`<img class="catalog-icons" src="${p.icons}" alt="${label}">`:'<span class="digital-functions">24h <span>°C/°F</span> ♫</span>'}</button>`}
function modelDimensions(p){return `<div class="dimensions">Dimensiones: ${p.dimensions}</div>`}
function showFeatures(p){const d=document.querySelector('#functions-viewer');d.querySelector('h2').textContent=p.code;d.querySelector('.function-dimensions').textContent='Dimensiones: '+p.dimensions;d.querySelector('ul').replaceChildren(...p.features.map(f=>{const li=document.createElement('li');li.textContent=f;return li}));d.showModal()}
function colorText(c){return c.id ? c.id+' · '+c.name : c.name}
function show(p,c){document.querySelector('#large').src=c.src;document.querySelector('#large').alt=p.code+' · '+colorText(c);document.querySelector('#caption').textContent=p.code+' · '+colorText(c);viewer.showModal()}
function render(){const term=document.querySelector('#search').value.trim().toLowerCase();const category=document.querySelector('#category').value;const list=products.filter(p=>(p.code+' '+p.supplier+' '+p.type).toLowerCase().includes(term)&&(!category||p.type===category));document.querySelector('#count').textContent=list.length+' modelos · '+list.reduce((n,p)=>n+p.colors.length,0)+' variantes de color';grid.replaceChildren();for(const p of list){let active={name:'En ambiente',src:p.ambient};const card=document.createElement('article');card.className='card';card.innerHTML=`<button class="picture ambient" aria-label="Ampliar ${p.code}"><img src="${active.src}" loading="lazy" decoding="async" alt="${p.code} · ${active.name}"><span class="zoom">Ampliar ↗</span></button><button class="ambient-toggle" title="Volver a la foto ambientada" aria-label="Volver a la foto ambientada" hidden>↶</button><div class="details"><div class="model-heading"><h2>${p.code}</h2>${modelSpecs(p)}</div>${modelDimensions(p)}<div class="variants" aria-label="Colores de ${p.code}"></div></div>`;card.querySelector('.functions').onclick=()=>showFeatures(p);card.querySelector('.picture').onclick=()=>show(p,active);card.querySelector('.ambient-toggle').onclick=()=>{active={name:'En ambiente',src:p.ambient};card.querySelector('.picture').classList.add('ambient');card.querySelector('.picture img').src=active.src;card.querySelector('.picture img').alt=p.code+' en ambiente';card.querySelector('.ambient-toggle').hidden=true;card.querySelectorAll('.variant').forEach(x=>x.setAttribute('aria-pressed','false'))};for(const c of p.colors){const b=document.createElement('button');b.className='variant';b.title=colorText(c);b.setAttribute('aria-label',colorText(c));b.setAttribute('aria-pressed',String(c===active));b.innerHTML=`<img src="${c.src}" alt="" loading="lazy"><span><b>${c.id}</b><br>${c.name}</span>`;b.onclick=()=>{active=c;card.querySelector('.picture').classList.remove('ambient');card.querySelector('.picture img').src=c.src;card.querySelector('.picture img').alt=p.code+' · '+colorText(c);card.querySelector('.ambient-toggle').hidden=false;card.querySelectorAll('.variant').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))};card.querySelector('.variants').append(b)}grid.append(card)}if(!list.length)grid.innerHTML='<p class="empty">No encontramos modelos con ese código.</p>'}
document.querySelector('#category').addEventListener('change',render);document.querySelector('#search').addEventListener('input',render);document.querySelector('.close').onclick=()=>viewer.close();viewer.addEventListener('click',e=>{if(e.target===viewer){const r=viewer.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)viewer.close()}});fetch('products.json?v=final-27-20261021', {cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(p=>{products=p;render()}).catch(()=>{document.querySelector('#count').textContent='No se pudo cargar el catálogo. Volvé a intentar.'});
</script></body></html>
